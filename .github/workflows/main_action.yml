# Main workflow

name: Main

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUSH_TO_REG: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true )}}

jobs:
  checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # Пишем HEAD здесь: в артефакте .git нет (upload-artifact исключает его с v4.4+)
      - name: Update git HEAD Rev
        run: find . -type f -name "CurrentCommit.txt" -exec sh -c 'for file do git rev-parse --verify HEAD > "$file"; echo "$file - $(cat $file)"; done' _ {} +
      - name: Upload repo
        uses: actions/upload-artifact@v6
        with:
          name: repo-rev
          path: .

  registry-login:
    runs-on: ubuntu-latest
    needs: checkout
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  mr-build-push:
    runs-on: ubuntu-latest
    needs: registry-login
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download repo
        uses: actions/download-artifact@v7
        with:
          name: repo-rev
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push 'MotoRodeo site' docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH_TO_REG }}
          tags: ghcr.io/amccore/mr_web:latest
          file: DockerfileMotoRodeoWeb

  finalize:
    runs-on: ubuntu-latest
    needs: [mr-build-push]
    steps:
      - run: echo "All images built and pushed successfully"
